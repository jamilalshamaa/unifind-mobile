name: Release to TestFlight and Play internal testing

# Every push to main builds both apps and sends them to the testers.
# iOS goes to TestFlight. Android goes to the Play internal track.
# Store review stays a manual step.
on:
  push:
    branches: ["main"]

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: production
  build_android:
    type: build
    params:
      platform: android
      profile: production
  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
  submit_android:
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
